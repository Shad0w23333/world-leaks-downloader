name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            bundle-args: --bundles nsis
          - platform: macos
            runner: macos-latest
            bundle-args: --bundles dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('World Leaks Downloader {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: world-leaks-downloader-[platform]-[arch]-[bundle]
          args: ${{ matrix.bundle-args }}

      - name: Create portable Windows zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive `
            -LiteralPath src-tauri/target/release/world-leaks-downloader.exe `
            -DestinationPath dist/world-leaks-downloader-${{ github.ref_name }}-windows-x64-portable.zip `
            -Force

      - name: Upload portable Windows zip to release
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/world-leaks-downloader-${{ github.ref_name }}-windows-x64-portable.zip

      - name: Upload portable Windows zip artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: world-leaks-downloader-windows-x64-portable
          path: dist/world-leaks-downloader-${{ github.ref_name }}-windows-x64-portable.zip
          if-no-files-found: error
